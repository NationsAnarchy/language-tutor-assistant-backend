[project]
name = "language-tutor-backend"
version = "0.1.0"
description = "Production-grade LangGraph & FastAPI Language Tutor Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "langgraph>=0.2.0,<2.0.0",
    "langchain>=0.3.0,<2.0.0",
    "langchain-google-genai>=2.0.0,<5.0.0",
    "langchain-pinecone>=0.2.0,<1.0.0",
    "google-genai>=1.0.0,<3.0.0",
    "pinecone-client>=5.0.0,<7.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "slowapi>=0.1.10,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
